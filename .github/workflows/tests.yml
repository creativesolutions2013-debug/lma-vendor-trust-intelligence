name: Run tests

on:
  push:
    branches:
      - main
      - feature/m5-upload-assessment
  pull_request:
    branches:
      - main
      - feature/m4c2b-tenant-read-boundary

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile application and M5D evaluator before tests
        run: python -m py_compile app.py src/upload_evaluation.py

      - name: Run tests
        run: pytest -q

      - name: Generate M5C holdout baseline (descriptive, not an accuracy gate)
        env:
          M5C_REPORT_PATH: m5c-baseline.json
        run: python -m pytest -q -s tests/test_m5c_benchmark.py

      - name: Publish M5C baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5c-baseline
          path: m5c-baseline.json
          if-no-files-found: warn

  postgres-compatibility:
    name: PostgreSQL compatibility
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lma
          POSTGRES_PASSWORD: lma_test_password
          POSTGRES_DB: vendor_trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lma -d vendor_trust"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://lma:lma_test_password@localhost:5432/vendor_trust

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile application and M5D evaluator before PostgreSQL tests
        run: python -m py_compile app.py src/upload_evaluation.py

      - name: Apply Alembic migrations to PostgreSQL
        run: alembic upgrade head

      - name: Verify PostgreSQL schema
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from src.db import engine

          expected = {
              "alembic_version",
              "assessments",
              "engagements",
              "evidence",
              "findings",
              "monitoring_events",
              "vendors",
          }

          actual = set(inspect(engine).get_table_names())
          missing = expected - actual

          if missing:
              raise SystemExit(
                  f"Missing PostgreSQL tables: {sorted(missing)}"
              )

          print(
              "PostgreSQL schema verified:",
              ", ".join(sorted(actual)),
          )
          PY

      - name: Run test suite with PostgreSQL configuration
        run: pytest -q
