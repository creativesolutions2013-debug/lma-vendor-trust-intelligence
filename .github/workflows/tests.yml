name: Run tests

on:
  push:
    branches:
      - main
      - feature/m5-upload-assessment
  pull_request:
    branches:
      - main
      - feature/m4c2b-tenant-read-boundary

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile application and M5D evaluator before tests
        run: python -m py_compile app.py src/assessment_worklist.py src/upload_assessment.py src/upload_evaluation.py src/upload_assessment_ui.py src/guided_assessment_demo.py src/guided_assessment_package.py tests/test_upload_assessment.py tests/test_upload_assessment_ui.py tests/test_guided_assessment_demo_ui.py tests/test_upload_followup.py tests/test_e2e_intake_progressive_disclosure.py tests/test_e2e_analyst_pilot.py

      - name: Compile unwired M7 session lease and metadata prerequisite
        run: python -m py_compile app.py src/server_sessions.py src/session_identity_source.py src/tenant_read_scope.py src/session_leased_read.py src/assessment_snapshot.py src/evidence_custody_preflight.py tests/test_session_operation_lease.py tests/test_assessment_snapshot.py tests/test_evidence_custody_preflight.py

      - name: Compile synthetic immutable evidence custody before tests
        run: python -m py_compile app.py src/db.py src/session_leased_read.py src/synthetic_custody_guards.py src/synthetic_evidence_custody.py migrations/versions/0014b_synthetic_custody.py tests/test_synthetic_evidence_custody.py tests/test_synthetic_custody_migration.py

      - name: Compile resumable synthetic analyst assessment before tests
        run: python -m py_compile app.py src/db.py src/upload_assessment.py src/synthetic_evidence_custody.py src/resumable_assessment.py src/resumable_assessment_state.py src/synthetic_revision_guards.py migrations/versions/0014c_assessment_revisions.py tests/test_resumable_assessment.py tests/test_resumable_assessment_state.py tests/test_synthetic_revision_migration.py

      - name: Verify durable synthetic save resume review and report
        run: pytest -q tests/test_resumable_assessment.py tests/test_resumable_assessment_state.py tests/test_synthetic_revision_migration.py

      - name: Verify synthetic immutable evidence byte custody regression
        run: pytest -q tests/test_synthetic_evidence_custody.py tests/test_synthetic_custody_migration.py

      - name: Verify synthetic M7 session and assessment authorization
        run: pytest -q tests/test_session_operation_lease.py tests/test_assessment_snapshot.py tests/test_evidence_custody_preflight.py

      - name: Verify source-bound reviewed gaps and draft follow-up
        run: pytest -q tests/test_upload_followup.py

      - name: Verify concise intake and scoring safeguards first
        run: pytest -q tests/test_e2e_intake_progressive_disclosure.py

      - name: Exercise synthetic evidence-to-follow-up analyst journey
        run: pytest -q tests/test_e2e_analyst_pilot.py

      - name: Run tests
        run: pytest -q

      - name: Generate M5C holdout baseline (descriptive, not an accuracy gate)
        env:
          M5C_REPORT_PATH: m5c-baseline.json
        run: python -m pytest -q -s tests/test_m5c_benchmark.py

      - name: Publish M5C baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5c-baseline
          path: m5c-baseline.json
          if-no-files-found: warn

  postgres-compatibility:
    name: PostgreSQL compatibility
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lma
          POSTGRES_PASSWORD: lma_test_password
          POSTGRES_DB: vendor_trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lma -d vendor_trust"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://lma:lma_test_password@localhost:5432/vendor_trust

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile application and M5D evaluator before PostgreSQL tests
        run: python -m py_compile app.py src/assessment_worklist.py src/upload_assessment.py src/upload_evaluation.py src/upload_assessment_ui.py src/guided_assessment_demo.py src/guided_assessment_package.py tests/test_upload_assessment.py tests/test_upload_assessment_ui.py tests/test_guided_assessment_demo_ui.py tests/test_upload_followup.py tests/test_e2e_intake_progressive_disclosure.py tests/test_e2e_analyst_pilot.py

      - name: Compile unwired M7 session lease and metadata prerequisite
        run: python -m py_compile app.py src/server_sessions.py src/session_identity_source.py src/tenant_read_scope.py src/session_leased_read.py src/assessment_snapshot.py src/evidence_custody_preflight.py tests/test_session_operation_lease.py tests/test_assessment_snapshot.py tests/test_evidence_custody_preflight.py

      - name: Compile synthetic immutable evidence custody before tests
        run: python -m py_compile app.py src/db.py src/session_leased_read.py src/synthetic_custody_guards.py src/synthetic_evidence_custody.py migrations/versions/0014b_synthetic_custody.py tests/test_synthetic_evidence_custody.py tests/test_synthetic_custody_migration.py

      - name: Compile resumable synthetic analyst assessment before tests
        run: python -m py_compile app.py src/db.py src/upload_assessment.py src/synthetic_evidence_custody.py src/resumable_assessment.py src/resumable_assessment_state.py src/synthetic_revision_guards.py migrations/versions/0014c_assessment_revisions.py tests/test_resumable_assessment.py tests/test_resumable_assessment_state.py tests/test_synthetic_revision_migration.py

      - name: Verify durable synthetic save resume review and report
        run: pytest -q tests/test_resumable_assessment.py tests/test_resumable_assessment_state.py tests/test_synthetic_revision_migration.py

      - name: Verify synthetic immutable evidence byte custody regression
        run: pytest -q tests/test_synthetic_evidence_custody.py tests/test_synthetic_custody_migration.py

      - name: Verify synthetic M7 session and assessment authorization
        run: pytest -q tests/test_session_operation_lease.py tests/test_assessment_snapshot.py tests/test_evidence_custody_preflight.py

      - name: Verify source-bound reviewed gaps and draft follow-up
        run: pytest -q tests/test_upload_followup.py

      - name: Apply Alembic migrations to PostgreSQL
        run: alembic upgrade head

      - name: Verify PostgreSQL schema
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from src.db import engine

          expected = {
              "alembic_version",
              "assessments",
              "engagements",
              "evidence",
              "findings",
              "monitoring_events",
              "synthetic_evidence_objects",
              "synthetic_assessment_revisions",
              "vendors",
          }

          actual = set(inspect(engine).get_table_names())
          missing = expected - actual

          if missing:
              raise SystemExit(
                  f"Missing PostgreSQL tables: {sorted(missing)}"
              )

          print(
              "PostgreSQL schema verified:",
              ", ".join(sorted(actual)),
          )
          PY

      - name: Verify concise intake and scoring safeguards first
        run: pytest -q tests/test_e2e_intake_progressive_disclosure.py

      - name: Exercise synthetic evidence-to-follow-up analyst journey
        run: pytest -q tests/test_e2e_analyst_pilot.py

      - name: Run test suite with PostgreSQL configuration
        run: pytest -q
